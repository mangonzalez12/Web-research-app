services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: exposoma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build: ./database
    environment:
      DB_HOST: db
      DB_NAME: exposoma
      DB_USER: postgres
      DB_PASSWORD: postgres
      SHINY_WRITER_PASSWORD: some_dev_password
      ANALYST_READER_PASSWORD: some_dev_password2
    depends_on:
      - db

  app:
    build: ./app
    platform: linux/amd64
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_NAME: exposoma
      DB_USER: shiny_writer
      DB_PASSWORD: some_dev_password
    ports:
      - "3838:3838"
    depends_on:
      - db

volumes:
  pgdata:
